<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Выздоравливай, Мария ♥</title>
<meta name="theme-color" content="#ffd6e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #ffd6e7; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Comfortaa", "Trebuchet MS", system-ui, sans-serif;
  }
  canvas { display: block; }
  button { font-family: inherit; }

  /* overlay card */
  #ov {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 8;
    background: rgba(255, 214, 231, .35); padding: 16px; box-sizing: border-box; touch-action: pan-y;
  }
  #ov.show { display: flex; }
  .card {
    background: #fff; border-radius: 24px; padding: 22px 24px; max-width: 460px; width: 100%;
    box-sizing: border-box; max-height: 100%; overflow: auto; text-align: center;
    box-shadow: 0 10px 40px rgba(194, 65, 111, .25); animation: pop .35s ease-out;
  }
  .card h1 { margin: 0 0 12px; color: #d63d7a; font-size: clamp(21px, 5vw, 28px); line-height: 1.2; }
  .card p { margin: 0 0 18px; color: #6b4a5a; white-space: pre-line; line-height: 1.5; font-size: clamp(14px, 3.6vw, 16px); }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .card button {
    font-weight: 700; font-size: 17px; color: #fff; cursor: pointer;
    background: linear-gradient(#ff8ab8, #ff5c98); border: 0; border-radius: 999px;
    padding: 12px 26px; box-shadow: 0 4px 0 #d63d7a;
  }
  .card button.alt { background: #fff; color: #d63d7a; box-shadow: 0 4px 0 #f3a9c6, inset 0 0 0 2px #ffb3d1; }
  .card button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d63d7a; }
  .card button:disabled { opacity: .55; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-height: 560px) {
    .card { padding: 14px 18px; }
    .card h1 { margin-bottom: 8px; }
    .card p { margin-bottom: 12px; font-size: 13.5px; line-height: 1.4; }
    .card button { padding: 9px 20px; font-size: 15px; }
  }

  /* fixed chrome */
  #mute {
    position: fixed; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; z-index: 9;
    border: 0; background: rgba(255, 255, 255, .85); font-size: 18px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
  }
  .coinpill {
    background: #fff3c4; color: #7a5200; border-radius: 999px; padding: 7px 13px; font-weight: 700;
    font-size: 15px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
  }
  #coins { position: fixed; top: 10px; left: 10px; z-index: 9; }
  body.playing #coins, .screen.show ~ #coins { display: none; }
  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); z-index: 10; opacity: 0;
    background: #3a2530; color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px;
    max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; transition: .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* screens */
  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column; overflow: auto; z-index: 5;
    touch-action: pan-y; -webkit-overflow-scrolling: touch;
  }
  .screen.show { display: flex; }
  .scrHead {
    display: flex; align-items: center; gap: 10px; padding: 10px 60px 10px 12px;
    position: sticky; top: 0; z-index: 2; background: rgba(0, 0, 0, .18);
  }
  .back {
    border: 0; background: rgba(255, 255, 255, .9); border-radius: 999px; width: 40px; height: 40px;
    font-size: 20px; cursor: pointer; color: #6b4a5a; flex: none;
  }
  #scrTitle { flex: 1; font-weight: 700; font-size: clamp(15px, 4vw, 19px); }
  #scrBody { flex: 1; padding: 12px 16px 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .small { font-size: 12px; opacity: .8; text-align: center; margin: 0; }
  .btn {
    font-weight: 700; border: 0; border-radius: 999px; padding: 10px 18px; font-size: 15px; cursor: pointer;
    color: #fff; background: linear-gradient(#ff8ab8, #ff5c98); box-shadow: 0 3px 0 #b8326a;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8326a; }
  .btn.gold { background: linear-gradient(#ffd56b, #f0a500); color: #5a3a00; box-shadow: 0 3px 0 #b07800; }
  .btn.gray { background: linear-gradient(#d8d0de, #aea4b8); color: #fff; box-shadow: 0 3px 0 #7d7388; }
  .btn.big { font-size: 20px; padding: 14px 34px; }
  .btn:disabled { opacity: .5; }

  /* casino */
  .screen.casino {
    color: #fff6e0;
    background: radial-gradient(ellipse at 50% 35%, #2f8a55 0%, #1b5e38 55%, #0f3a22 100%);
  }
  .screen.casino .scrHead { background: linear-gradient(#6b3f1f, #4e2c14); border-bottom: 3px solid #c9963f; }
  .hub { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 640px; }
  .tile {
    flex: 1 1 220px; border: 3px solid #c9963f; border-radius: 20px; cursor: pointer; padding: 18px 14px;
    background: linear-gradient(#8a5a2b, #5e3a18); color: #fff6e0; box-shadow: 0 6px 0 #3a220c;
  }
  .tile:active { transform: translateY(3px); box-shadow: 0 3px 0 #3a220c; }
  .tileIcon { font-size: 44px; }
  .tileName { font-size: 20px; font-weight: 700; margin: 6px 0 4px; }
  .tileDesc { font-size: 13px; opacity: .85; }

  .poker {
    --cw: clamp(34px, min(11vw, 10.5vh), 62px);
    width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .sheriff { display: flex; align-items: center; gap: 10px; width: 100%; }
  .avatar { font-size: clamp(30px, 8vh, 44px); flex: none; }
  .bubble {
    flex: 1; background: #fff6e0; color: #4a3020; border-radius: 14px; padding: 8px 12px; font-size: 14px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .2);
  }
  .row { display: flex; gap: 6px; justify-content: center; }
  .pcard {
    width: var(--cw); height: calc(var(--cw) * 1.4); background: #fff; border-radius: 8px; color: #222;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .35); font-size: calc(var(--cw) * .36); line-height: 1.05;
    animation: deal .25s ease-out;
  }
  .pcard b { font-size: calc(var(--cw) * .44); }
  .pcard.red { color: #d63031; }
  .pcard.hl { box-shadow: 0 0 0 3px #ffd23f, 0 3px 8px rgba(0, 0, 0, .35); }
  .pcard.back { background: repeating-linear-gradient(45deg, #b33a2c 0 6px, #d9534f 6px 12px); border: 3px solid #fff; box-sizing: border-box; }
  .pcard.empty { background: rgba(255, 255, 255, .08); box-shadow: none; border: 2px dashed rgba(255, 255, 255, .25); box-sizing: border-box; animation: none; }
  @keyframes deal { from { transform: translateY(-14px) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .potline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .pot { background: rgba(0, 0, 0, .3); padding: 5px 14px; border-radius: 999px; font-weight: 700; }
  .result { background: #fff6e0; color: #7a3d00; padding: 5px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; white-space: pre-line; text-align: center; }
  .hint { font-size: 14px; min-height: 18px; color: #ffe39a; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 44px; align-items: center; }
  .thinking { opacity: .85; font-size: 15px; }
  .rules { font-size: 13px; max-width: 520px; opacity: .85; }
  .rules summary { cursor: pointer; text-align: center; }
  .rules p { line-height: 1.45; }
  @media (max-height: 500px) {
    .scrHead { padding-top: 6px; padding-bottom: 6px; }
    .back { width: 34px; height: 34px; font-size: 17px; }
    #scrBody { padding: 8px 12px 16px; gap: 6px; }
    .poker { --cw: clamp(30px, 9vh, 62px); gap: 5px; }
    .avatar { font-size: 26px; }
    .bubble { padding: 5px 10px; font-size: 13px; }
    .pot, .result { padding: 3px 12px; font-size: 13px; }
    .hint { font-size: 13px; min-height: 0; }
    .actions { min-height: 38px; }
    .actions .btn { padding: 8px 14px; font-size: 14px; }
  }

  .slots { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 520px; }
  .machine {
    background: linear-gradient(#ff8ab8, #d63d7a); border-radius: 24px; padding: 14px; border: 4px solid #ffd23f;
    box-shadow: 0 6px 0 #8e1f4d;
  }
  .reels { display: flex; gap: 8px; }
  .reel {
    --rs: clamp(56px, min(20vw, 20vh), 100px);
    width: var(--rs); height: var(--rs); font-size: calc(var(--rs) * .58); background: #fff; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; box-shadow: inset 0 4px 10px rgba(0, 0, 0, .2);
  }
  .reel.spin { filter: blur(1px); }
  .slmsg { text-align: center; margin-top: 10px; font-weight: 700; color: #fff; min-height: 20px; }
  .slmsg.won { color: #fff36b; }
  .bets { display: flex; gap: 10px; }
  .chip {
    width: 48px; height: 48px; border-radius: 50%; border: 4px dashed #fff; background: #c0392b; color: #fff;
    font-weight: 700; font-size: 15px; cursor: pointer; opacity: .6;
  }
  .chip.on { opacity: 1; background: #e67e22; transform: scale(1.1); }
  .paytable { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; font-size: 13px; opacity: .9; }

  /* ranch: Cowboy vs Bull */
  .ranchscr #scrBody { padding: 8px 10px 24px; }
  .ranch {
    --cw: clamp(28px, 9.5vw, 46px); --red: #e0463c; --blue: #3a7bd5; --grn: #2ecc71;
    width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 8px;
  }
  .rtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rid { font-size: 13px; opacity: .85; }
  .jp {
    background: linear-gradient(#ffd56b, #f0a500); color: #4a2c00; border-radius: 999px; padding: 5px 12px;
    font-size: 13px; box-shadow: 0 2px 0 #9c6a00; white-space: nowrap;
  }
  .jp b { font-size: 15px; }
  .rtools { display: flex; gap: 6px; align-items: center; }
  .trend {
    flex: 1; min-width: 0; height: 34px; border: 0; border-radius: 999px; background: rgba(0, 0, 0, .28); cursor: pointer;
    display: flex; gap: 5px; align-items: center; justify-content: center; color: #fff6e0; font-family: inherit; font-size: 12px;
  }
  .trend i { width: 14px; height: 14px; border-radius: 50%; display: block; flex: none; }
  .t-cowboy { background: var(--red); } .t-bull { background: var(--blue); } .t-draw { background: var(--grn); }
  .ricon { width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .9); font-size: 16px; cursor: pointer; flex: none; }
  .rtimer { position: relative; height: 24px; border-radius: 999px; background: rgba(0, 0, 0, .3); overflow: hidden; }
  .rbar { position: absolute; inset: 0 auto 0 0; background: #ffd23f; transition: width .15s linear; }
  .rbar.hurry { background: #ff7a45; } .rbar.reveal { background: #8fb3ff; } .rbar.result { background: #7bd88f; }
  .rtimer span { position: relative; display: block; text-align: center; line-height: 24px; font-size: 13px; font-weight: 700; color: #3a2510; }
  .rtable {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border-radius: 18px;
    background: rgba(0, 0, 0, .18); border: 2px solid rgba(201, 150, 63, .6);
  }
  .rside { border-radius: 14px; padding: 6px 4px; text-align: center; transition: .3s; border: 2px solid transparent; }
  .rside.cowboy { background: rgba(224, 70, 60, .28); } .rside.bull { background: rgba(58, 123, 213, .3); }
  .rside.won { border-color: #ffd23f; box-shadow: 0 0 16px rgba(255, 210, 63, .6); }
  .rside.lost { opacity: .55; }
  .who { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .hand { font-size: 12px; min-height: 16px; margin-top: 4px; color: #ffe39a; font-weight: 700; }
  .board { grid-column: 1 / -1; padding-top: 4px; }
  .ranch .pcard { border-radius: 6px; }
  .rbanner { text-align: center; font-size: 14px; min-height: 38px; line-height: 1.35; }
  .wintxt { color: #fff36b; font-size: 16px; }
  .zlabel { font-size: 12px; opacity: .8; text-align: center; margin-top: 2px; }
  .zones { display: flex; flex-direction: column; gap: 6px; }
  .zgrid { display: grid; gap: 6px; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .gwin { grid-template-columns: repeat(6, 1fr); }
  .gwin .zone { grid-column: span 2; } .gwin .zone:nth-child(n+4) { grid-column: span 3; }
  .zone {
    position: relative; border: 2px solid rgba(255, 255, 255, .25); border-radius: 12px; padding: 6px 4px 5px; cursor: pointer;
    background: rgba(0, 0, 0, .25); color: #fff6e0; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-height: 92px; transition: transform .1s, box-shadow .2s, opacity .2s;
  }
  .zone.zc { background: linear-gradient(#c4382f, #8f2219); } .zone.zb { background: linear-gradient(#3a7bd5, #234f8f); }
  .zone.zd { background: linear-gradient(#27ae60, #1a7040); }
  .zone:disabled { cursor: default; }
  .zone.mine { border-color: #ffd23f; }
  .zone.hit { box-shadow: 0 0 0 3px #ffd23f, 0 0 18px rgba(255, 210, 63, .7); animation: glow 1s ease-in-out infinite alternate; }
  .zone.miss { opacity: .45; }
  .zone.bump { animation: bump .2s; }
  @keyframes bump { 50% { transform: scale(.94); } }
  @keyframes glow { to { box-shadow: 0 0 0 3px #fff36b, 0 0 26px rgba(255, 243, 107, .9); } }
  .zn { font-size: 12px; font-weight: 700; line-height: 1.15; text-align: center; }
  .z-main .zn { font-size: 15px; }
  .zm { font-size: 15px; font-weight: 700; color: #ffe39a; }
  .z-main .zm { font-size: 18px; }
  .zt { font-size: 11px; opacity: .85; }
  .zme { font-size: 12px; font-weight: 700; color: #fff36b; min-height: 14px; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .25); display: block; }
  .dots i.hit { background: #ffd23f; } .dots i.ph { background: transparent; border: 1px solid rgba(255, 255, 255, .2); width: 5px; height: 5px; }
  .zs { font-size: 10px; opacity: .75; }
  .chips { display: flex; justify-content: center; gap: 8px; }
  .rdock {
    position: sticky; bottom: 0; z-index: 3; margin: 0 -10px; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px;
    background: #12482a; border-top: 3px solid #c9963f; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 16px rgba(0, 0, 0, .35);
  }
  .ractions { display: flex; gap: 8px; justify-content: center; }
  .ractions .btn { padding: 10px 12px; font-size: 14px; white-space: nowrap; }
  .ractions #rDeal { flex: 1; max-width: 190px; font-size: 17px; }
  .rchip {
    width: 52px; height: 52px; border-radius: 50%; border: 4px dashed rgba(255, 255, 255, .9); color: #fff; font-weight: 700;
    font-size: 14px; cursor: pointer; font-family: inherit; opacity: .7; transition: transform .1s; box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
  }
  .rchip.c10 { background: #7f8c8d; } .rchip.c50 { background: #c0392b; } .rchip.c100 { background: #2980b9; }
  .rchip.c500 { background: #8e44ad; } .rchip.c1000 { background: #d4a017; color: #3a2500; }
  .rchip.on { opacity: 1; transform: translateY(-4px) scale(1.08); box-shadow: 0 0 0 3px #fff36b, 0 5px 0 rgba(0, 0, 0, .35); }
  .rchip:disabled { opacity: .25; transform: none; }
  .balline { display: flex; justify-content: space-between; font-size: 14px; background: rgba(0, 0, 0, .25); border-radius: 999px; padding: 6px 14px; }
  #rWin { color: #fff36b; font-weight: 700; }
  #rTop { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .tb { width: 86px; text-align: center; background: rgba(0, 0, 0, .2); border-radius: 12px; padding: 5px 3px; }
  .tb.me { background: rgba(255, 138, 184, .45); }
  .tav { font-size: 22px; } .tnm { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tam { font-size: 12px; font-weight: 700; } .tw { color: #fff36b; }
  .rmodal {
    position: fixed; inset: 0; z-index: 7; display: none; align-items: flex-end; justify-content: center;
    background: rgba(0, 0, 0, .5); padding: 16px; box-sizing: border-box;
  }
  .rmodal.show { display: flex; }
  .rmbox {
    width: 100%; max-width: 520px; max-height: 85%; display: flex; flex-direction: column; background: #fff6e0; color: #4a3020;
    border-radius: 20px; overflow: hidden; animation: pop .25s ease-out; border: 3px solid #c9963f;
  }
  .rmhead { display: flex; align-items: center; gap: 6px; padding: 8px; background: linear-gradient(#6b3f1f, #4e2c14); }
  .rmtabs { flex: 1; display: flex; gap: 4px; overflow-x: auto; }
  .rmtab { border: 0; border-radius: 999px; padding: 7px 9px; font-family: inherit; font-weight: 700; font-size: 12.5px; background: transparent; color: #fff6e0; cursor: pointer; white-space: nowrap; }
  .rmtab.on { background: #fff6e0; color: #4e2c14; }
  .rmclose { border: 0; background: rgba(255, 255, 255, .9); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; flex: none; }
  .rmbody { overflow: auto; padding: 12px 14px 16px; font-size: 14px; line-height: 1.45; touch-action: pan-y; }
  .rmbody p { margin: 0 0 10px; }
  .rmbody .small { opacity: .75; }
  .rt { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
  .rt th, .rt td { padding: 5px 6px; border-bottom: 1px solid rgba(78, 44, 20, .15); text-align: left; }
  .rt td.wc { background: rgba(224, 70, 60, .2); font-weight: 700; } .rt td.wb { background: rgba(58, 123, 213, .22); font-weight: 700; }
  .rt td.wd { background: rgba(46, 204, 113, .25); font-weight: 700; }
  .wbar { display: flex; border-radius: 999px; overflow: hidden; color: #fff; font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .wbar div { padding: 6px 10px; white-space: nowrap; } .wbar .wc { background: #e0463c; } .wbar .wb { background: #3a7bd5; text-align: right; } .wbar .wd { background: #2ecc71; text-align: center; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: #fff; border-radius: 12px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
  .lb { display: flex; flex-direction: column; gap: 3px; }
  .lbr { display: grid; grid-template-columns: 26px 24px 1fr auto 48px; gap: 6px; align-items: center; padding: 5px 6px; border-radius: 10px; background: #fff; font-size: 13px; }
  .lbr.me { background: #ffd6e7; }
  .lbn { font-weight: 700; text-align: center; } .lbname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbp { font-size: 11px; color: #9c6a00; text-align: right; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; word-break: break-all; background: #fff; border-radius: 10px; padding: 8px; }
  @media (min-width: 700px) { .ranch { --cw: 50px; } }

  /* fish: Морской тир */
  .screen.fishscr { background: #031726; }
  .fishscr .scrHead { display: none; }
  .screen.fishscr.show ~ #mute { display: none; }
  .fishscr #scrBody { padding: 0; justify-content: center; gap: 0; overflow: hidden; }
  .fishscr #scrBody > .refill { position: fixed; bottom: 18%; left: 50%; transform: translateX(-50%); z-index: 6; }
  .fwrap { position: relative; flex: none; overflow: hidden; touch-action: none; color: #fff; }
  .fwrap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .fbtn {
    position: absolute; border: 0; border-radius: 50%; width: 2.6em; height: 2.6em; font-size: 1em; cursor: pointer;
    background: rgba(255, 255, 255, .88); color: #0a3f66; font-weight: 700; font-family: inherit; box-shadow: 0 .15em .4em rgba(0, 0, 0, .35);
    display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
  }
  .fbtn:active { transform: scale(.92); }
  .fclose { top: 6.6em; left: .5em; } .fmusic { top: 6.6em; right: .5em; }
  .fside { position: absolute; left: .5em; top: 36%; display: flex; flex-direction: column; gap: .5em; }
  .fside .fbtn { position: static; }
