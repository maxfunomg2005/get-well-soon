<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Выздоравливай, Мария ♥</title>
<meta name="theme-color" content="#ffd6e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #ffd6e7; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Comfortaa", "Trebuchet MS", system-ui, sans-serif;
  }
  canvas { display: block; }
  #ov {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(255, 214, 231, .35); padding: 16px; box-sizing: border-box;
  }
  #ov.show { display: flex; }
  .card {
    background: #fff; border-radius: 24px; padding: 22px 24px; max-width: 460px; width: 100%;
    box-sizing: border-box; max-height: 100%; overflow: auto; text-align: center;
    box-shadow: 0 10px 40px rgba(194, 65, 111, .25); animation: pop .35s ease-out;
  }
  .card h1 { margin: 0 0 12px; color: #d63d7a; font-size: clamp(21px, 5vw, 28px); line-height: 1.2; }
  .card p { margin: 0 0 18px; color: #6b4a5a; white-space: pre-line; line-height: 1.5; font-size: clamp(14px, 3.6vw, 16px); }
  .card button {
    font: inherit; font-weight: 700; font-size: 18px; color: #fff; cursor: pointer;
    background: linear-gradient(#ff8ab8, #ff5c98); border: 0; border-radius: 999px;
    padding: 12px 32px; box-shadow: 0 4px 0 #d63d7a;
  }
  .card button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d63d7a; }
  .card button:disabled { opacity: .55; }
  #mute {
    position: fixed; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: rgba(255, 255, 255, .85); font-size: 18px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-height: 560px) {
    .card { padding: 14px 18px; }
    .card h1 { margin-bottom: 8px; }
    .card p { margin-bottom: 12px; font-size: 13.5px; line-height: 1.4; }
    .card button { padding: 10px 28px; font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="card"><h1 id="ovTitle"></h1><p id="ovText"></p><button id="ovBtn"></button></div></div>
<button id="mute" aria-label="Звук">🔊</button>

<script>
/* ================== НАСТРОЙКИ — всё личное здесь ================== */
const CONFIG = {
  herName: "Мария",
  herNameGen: "Марии",          // "Здоровье Марии"
  myName: "Руслан",
  // Фото (необязательно): положи файлы в папку assets рядом с index.html.
  // Если файлов нет — нарисуются мультяшные лица.
  herPhoto: "assets/maria.jpg",
  myPhoto: "assets/ruslan.jpg",
  colors: {
    herHair: "#4a2c1d", herDress: "#ff6fae",
    myHair: "#2a1b12",  myShirt: "#5b8def",
    skin: "#ffd7b5",
  },
  title: "Выздоравливай, {her}! 💖",
  intro:
    "Вредные вирусы решили к тебе пристать — давай вместе их прогоним!\n\n" +
    "Нажимай на экран, чтобы прыгать (ещё раз в воздухе — двойной прыжок). " +
    "Собирай сердечки, суши, роллы и чай. Увидишь мотивофосфат — хватай обязательно 😉\n\n" +
    "В конце тебя кое-кто ждёт ♥",
  levelNotes: [
    "Вот это да! Даже когда болеешь, ты самая сильная из всех, кого я знаю.",
    "Половина пути позади! Уровень мотивофосфата в крови растёт 📈\n(И попей водички по-настоящему, ладно? 💧)",
  ],
  finalTitle: "Ты победила! 💖",
  finalMessage:
    "Все вирусы побеждены, мотивофосфат на максимуме.\n\n" +
    "Теперь отдыхай, побольше спи и скорее выздоравливай — а как поправишься, идём есть роллы и суши, сколько влезет 🍣\n\n" +
    "Я рядом и люблю тебя больше, чем все сердечки в этой игре.\n\n" +
    "Твой {me} ♥",
};
/* ================================================================== */

(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const fill = s => s.replace(/\{her\}/g, CONFIG.herName).replace(/\{me\}/g, CONFIG.myName);
const FONT = '"Comfortaa", "Trebuchet MS", system-ui, sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = k => k < 0 ? 0 : k > 1 ? 1 : k;
const ease = k => { k = clamp01(k); return k * k * (3 - 2 * k); };
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------- canvas sizing ---------- */
const H = 450, GROUND = 380;
let W = 800, S = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  W = Math.round(Math.max(520, Math.min(1000, H * vw / vh)));
  S = Math.min(vw / W, vh / H);
  cv.style.width = (W * S) + 'px'; cv.style.height = (H * S) + 'px';
  cv.width = Math.round(W * S * DPR); cv.height = Math.round(H * S * DPR);
}
window.addEventListener('resize', resize); resize();

/* ---------- photos (optional) ---------- */
function loadImg(src) {
  const o = { img: null };
  if (!src || typeof Image === 'undefined') return o;
  const im = new Image();
  im.onload = () => { o.img = im; };
  im.src = src;
  return o;
}
const herPhoto = loadImg(CONFIG.herPhoto), myPhoto = loadImg(CONFIG.myPhoto);

/* ---------- audio ---------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, dur, type = 'sine', vol = 0.12, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
const sfx = {
  jump: () => tone(420, 700, 0.14, 'sine', 0.12),
  jump2: () => tone(600, 1000, 0.14, 'sine', 0.1),
  pick: () => { tone(880, 880, 0.08, 'triangle', 0.12); tone(1320, 1320, 0.12, 'triangle', 0.1, 0.07); },
  power: () => [660, 880, 1100, 1320].forEach((f, i) => tone(f, f, 0.1, 'triangle', 0.1, i * 0.06)),
  hit: () => tone(240, 90, 0.25, 'square', 0.05),
  level: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.1, i * 0.1)),
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.25, 'triangle', 0.1, i * 0.13)),
};

/* ---------- game data ---------- */
const LEVELS = [
  { theme: 'bedroom', name: 'Уровень 1 · Побег из-под одеяла', speed: 240, length: 28, gapMin: 1.35, gapMax: 2.3, fly: 0,    dbl: 0 },
  { theme: 'city',    name: 'Уровень 2 · Город микробов',       speed: 275, length: 30, gapMin: 1.15, gapMax: 2.0, fly: 0.35, dbl: 0.1 },
  { theme: 'sky',     name: 'Уровень 3 · Над облаками',         speed: 305, length: 30, gapMin: 1.05, gapMax: 1.8, fly: 0.4,  dbl: 0.2 },
];
const PICKS = [
  { k: 'heart', v: 3,  w: 4,   txt: '+3 ♥' },
  { k: 'sushi', v: 6,  w: 2,   txt: 'Суши! +6' },
  { k: 'roll',  v: 6,  w: 2,   txt: 'Роллы! +6' },
  { k: 'tea',   v: 4,  w: 1.5, txt: 'Тёплый чай +4' },
  { k: 'motiv', v: 12, w: 0.5, txt: 'Мотивофосфат! +12' },
];
const HIT_TXT = ['Апчхи!', 'Фу, микробы!', 'Шмыг…', 'Кхе-кхе!'];
const G = 2100, J1 = 760, J2 = 650;

const P = { x: 140, y: GROUND, vy: 0, onGround: true, jumps: 0, coyote: 0, buffer: 0, inv: 0, sq: 0 };
let state = 'title', level = 0, theme = 'bedroom', lvlT = 0, worldX = 0, spd = 240, t = 0;
let health = 10, shownHealth = 10, healedOnce = false;
let viruses = [], pickups = [], parts = [], texts = [];
let obsT = 0, pickT = 0, banner = 0, shake = 0, fT = 0, fin = null;

function status(h) {
  return h >= 100 ? 'Полностью здорова! 💪' : h >= 70 ? 'Почти здорова 😊' : h >= 35 ? 'Уже лучше 🙂' : 'Болею 🤒';
}

/* ---------- overlay ---------- */
const ov = $('ov'), ovBtn = $('ovBtn');
let onBtn = null;
function showOverlay(title, text, btn, cb) {
  $('ovTitle').textContent = title; $('ovText').textContent = text;
  ovBtn.textContent = btn; onBtn = cb;
  ovBtn.disabled = true;
  ov.classList.add('show');
  setTimeout(() => { ovBtn.disabled = false; try { ovBtn.focus(); } catch (e) {} }, 600);
}
function pressBtn() {
  if (ovBtn.disabled || !ov.classList.contains('show')) return;
  audio(); ov.classList.remove('show');
  const f = onBtn; onBtn = null; if (f) f();
}
ovBtn.addEventListener('click', pressBtn);
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? '🔈' : '🔊'; audio(); });

/* ---------- flow ---------- */
function showTitle() {
  state = 'title'; theme = 'bedroom';
  let txt = fill(CONFIG.intro);
  if (window.innerHeight > window.innerWidth) txt += '\n\n📱 Совет: поверни телефон горизонтально.';
  showOverlay(fill(CONFIG.title), txt, 'Начать ♥', () => startLevel(0));
}
function startLevel(i) {
  level = i; theme = LEVELS[i].theme; lvlT = 0;
  viruses = []; pickups = []; obsT = 1.6; pickT = 0.6;
  P.y = GROUND; P.vy = 0; P.onGround = true; P.jumps = 0; P.inv = 0; P.x = 140;
  banner = 2.4; state = 'play';
}
function endLevel() {
  if (level < LEVELS.length - 1) {
    state = 'card'; sfx.level();
    theme = LEVELS[level + 1].theme;
    const note = CONFIG.levelNotes[level] ? fill(CONFIG.levelNotes[level]) + '\n\n' : '';
    showOverlay(`Уровень ${level + 1} пройден! 🎉`, `${note}Здоровье: ${Math.round(health)}% — ${status(health)}`,
      'Дальше ▶', () => startLevel(level + 1));
  } else startFinale();
}
function startFinale() {
  state = 'finale'; fT = 0; banner = 0; viruses = [];
  fin = { sx: P.x, sy: P.y, hx: W + 80, met: false, shown: false, emit: 0 };
  sfx.win();
}
function restart() {
  health = 10; shownHealth = 10; healedOnce = false; worldX = 0;
  parts = []; texts = []; P.x = 140; P.y = GROUND;
  startLevel(0);
}

/* ---------- input ---------- */
function tryJump() {
  if (P.onGround || P.coyote > 0) {
    P.vy = -J1; P.onGround = false; P.coyote = 0; P.jumps = 1; sfx.jump();
    puff(P.x, GROUND, 5, '#ffffff');
  } else if (P.jumps < 2) {
    P.vy = -J2; P.jumps = 2; sfx.jump2();
    for (let i = 0; i < 8; i++) parts.push({ x: P.x, y: P.y - 10, vx: rand(-90, 90), vy: rand(20, 120), g: 0, life: 0.5, max: 0.5, kind: 'spark', c: '#ffe066', s: rand(2, 4) });
  } else P.buffer = 0.15;
}
window.addEventListener('pointerdown', e => {
  if (e.target.closest && (e.target.closest('button') || e.target.closest('.card'))) return;
  audio();
  if (state === 'play') { tryJump(); if (e.cancelable) e.preventDefault(); }
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    audio();
    if (ov.classList.contains('show')) pressBtn();
    else if (state === 'play') tryJump();
  }
});

/* ---------- spawning ---------- */
function spawnVirus(L) {
  const x = W + 40;
  const fly = Math.random() < L.fly;
  if (fly) {
    viruses.push({ x, baseY: GROUND - rand(92, 100), y: GROUND - 96, r: 16, fly: true, ph: rand(0, 6), c: '#b48ef0', c2: '#8a63d2' });
  } else {
    const r = rand(15, 21);
    viruses.push({ x, y: GROUND - r, r, fly: false, ph: rand(0, 6), c: '#8bd66f', c2: '#5fae4a' });
    if (Math.random() < L.dbl) viruses.push({ x: x + r + 22, y: GROUND - 16, r: 16, fly: false, ph: rand(0, 6), c: '#8bd66f', c2: '#5fae4a' });
  }
  // never force a hit to get a pickup
  for (const p of pickups) if (Math.abs(p.x - x) < 70 && p.y > GROUND - 120) p.y = GROUND - 160;
  return fly;
}
function spawnPickup() {
  const x = W + 40;
  const nearV = viruses.some(v => Math.abs(v.x - x) < 90);
  if (!nearV && Math.random() < 0.18) {
    for (let i = 0; i < 5; i++)
      pickups.push({ x: x + i * 34, y: GROUND - 40 - Math.sin(i / 4 * Math.PI) * 110, k: 'heart', v: 2, txt: '+2 ♥', ph: i });
    pickT += 0.6; return;
  }
  let tot = 0; PICKS.forEach(p => tot += p.w);
  let r = Math.random() * tot, tp = PICKS[0];
  for (const p of PICKS) { r -= p.w; if (r <= 0) { tp = p; break; } }
  const heights = [GROUND - 30, GROUND - 30, GROUND - 95, GROUND - 155];
  const y = nearV ? GROUND - 160 : heights[(Math.random() * heights.length) | 0];
  pickups.push({ x, y, k: tp.k, v: tp.v, txt: tp.txt, ph: rand(0, 6) });
}

/* ---------- effects ---------- */
function puff(x, y, n, c) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-80, 80), vy: rand(-60, -10), g: 100, life: 0.4, max: 0.4, kind: 'dot', c, s: rand(3, 6) });
}
function heartBurst(x, y, n, big) {
  const cols = ['#ff5c98', '#ff8ab8', '#ff3d6e', '#ffb3d1'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(60, big ? 260 : 160);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, g: 160, life: big ? 1.6 : 0.8, max: big ? 1.6 : 0.8, kind: 'heart', c: cols[i % 4], s: rand(5, big ? 11 : 7) });
  }
}
function floatText(x, y, s, c, big) { texts.push({ x, y, s, c, life: big ? 1.8 : 1.0, max: big ? 1.8 : 1.0, big }); }

/* ---------- update ---------- */
function hitsPlayer(cx, cy, r) {
  const rx = P.x - 11, ry = P.y - 50, rw = 22, rh = 46;
  const nx = Math.max(rx, Math.min(cx, rx + rw)), ny = Math.max(ry, Math.min(cy, ry + rh));
  const rr = r * 0.85;
  return (cx - nx) ** 2 + (cy - ny) ** 2 < rr * rr;
}
function physics(dt) {
  P.coyote -= dt; P.buffer -= dt;
  P.vy += G * dt; P.y += P.vy * dt;
  if (P.y >= GROUND) {
    if (!P.onGround) { P.sq = 0.14; puff(P.x, GROUND, 4, '#ffffff'); }
    P.y = GROUND; P.vy = 0; P.onGround = true; P.jumps = 0; P.coyote = 0.1;
    if (P.buffer > 0) { P.buffer = 0; tryJump(); }
  } else P.onGround = false;
}
function addHealth(v) {
  health = Math.min(100, health + v);
  if (health >= 100 && !healedOnce) {
    healedOnce = true;
    floatText(W / 2, 150, 'Полностью здорова! 💪', '#2fa84f', true);
    heartBurst(P.x, P.y - 30, 24, true);
  }
}
function updatePlay(dt) {
  const L = LEVELS[level];
  lvlT += dt;
  spd = L.speed * (1 + 0.12 * Math.min(1, lvlT / L.length));
  worldX += spd * dt;
  physics(dt);

  if (lvlT < L.length) {
    obsT -= dt;
    if (obsT <= 0) { const fly = spawnVirus(L); obsT = rand(L.gapMin, L.gapMax) + (fly ? 0.25 : 0); }
    pickT -= dt;
    if (pickT <= 0) { spawnPickup(); pickT = rand(0.7, 1.4); }
  }

  for (const v of viruses) {
    v.x -= spd * dt;
    if (v.fly) v.y = v.baseY + Math.sin(t * 3 + v.ph) * 12;
    if (P.inv <= 0 && hitsPlayer(v.x, v.y, v.r)) {
      health = Math.max(5, health - 6); P.inv = 1.2; shake = 7; sfx.hit();
      floatText(P.x + 10, P.y - 70, HIT_TXT[(Math.random() * HIT_TXT.length) | 0] + ' −6', '#7a4fc9');
      puff(P.x, P.y - 30, 10, '#b7f0a0');
    }
  }
  viruses = viruses.filter(v => v.x > -60);

  for (const p of pickups) {
    p.x -= spd * dt;
    const dx = p.x - P.x, dy = p.y - (P.y - 28);
    if (!p.got && dx * dx + dy * dy < 36 * 36) {
      p.got = true; addHealth(p.v);
      if (p.k === 'motiv') { sfx.power(); heartBurst(p.x, p.y, 18, true); floatText(p.x, p.y - 20, p.txt, '#e0890b', true); }
      else { sfx.pick(); heartBurst(p.x, p.y, 6, false); floatText(p.x, p.y - 20, p.txt, '#d63d7a'); }
    }
  }
  pickups = pickups.filter(p => !p.got && p.x > -60);

  if (lvlT > L.length + (W + 220 - P.x) / spd) endLevel();
}
function updateFinale(dt) {
  fT += dt;
  const slow = Math.max(0, 1 - fT / 2);
  worldX += spd * slow * dt;
  for (const p of pickups) p.x -= spd * slow * dt;
  pickups = pickups.filter(p => p.x > -60);
  health += (100 - health) * Math.min(1, dt * 1.5);
  if (fT > 3) health = 100;

  const himX = W - 150, top = GROUND - 110;
  fin.hx = lerp(W + 80, himX, ease(fT / 2.2));
  if (fT < 1.2) {
    const k = ease(fT / 1.2);
    P.y = lerp(fin.sy, GROUND - 200, k);
  } else {
    const k = ease((fT - 1.2) / 2.6);
    P.x = lerp(fin.sx, himX - 40, k);
    P.y = lerp(GROUND - 200, top, k) + Math.sin(fT * 3) * 6 * (1 - k);
  }
  if (fT > 3.85 && !fin.met) {
    fin.met = true; sfx.level();
    heartBurst(himX - 20, top - 40, 40, true);
  }
  if (fin.met && fT < 9) {
    fin.emit -= dt;
    if (fin.emit <= 0) { fin.emit = 0.18; heartBurst(himX - 20 + rand(-60, 60), top - 60, 2, false); }
  }
  if (fT > 5.6 && !fin.shown) {
    fin.shown = true;
    showOverlay(fill(CONFIG.finalTitle), fill(CONFIG.finalMessage), 'Сыграть ещё ↺', restart);
  }
}
function update(dt) {
  t += dt;
  shownHealth += (health - shownHealth) * Math.min(1, dt * 6);
  shake = Math.max(0, shake - dt * 30);
  banner = Math.max(0, banner - dt);
  P.inv = Math.max(0, P.inv - dt);
  P.sq += (0 - P.sq) * Math.min(1, dt * 12);

  if (state === 'play') updatePlay(dt);
  else if (state === 'finale') updateFinale(dt);
  else worldX += 90 * dt;

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of texts) { s.y -= 40 * dt; s.life -= dt; }
  texts = texts.filter(s => s.life > 0);
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function disc(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); circ(x, y, r); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + 0.9 * s);
  ctx.bezierCurveTo(x - 1.3 * s, y + 0.1 * s, x - 0.9 * s, y - 1.0 * s, x, y - 0.4 * s);
  ctx.bezierCurveTo(x + 0.9 * s, y - 1.0 * s, x + 1.3 * s, y + 0.1 * s, x, y + 0.9 * s);

/* ---------- render ---------- */
function render() {
  ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  if (theme === 'bedroom') bgBedroom(); else if (theme === 'city') bgCity(); else bgSky();

  if (state === 'finale') {
    const top = GROUND - 110;
    cloudPlatform(fin.hx - 20, top);
    drawPerson(fin.hx, top, { girl: false, flip: true, arms: fin.met ? 'hug' : 'wave' });
    if (fin.met) {
      const s = 22 + Math.sin(t * 6) * 3;
      heartPath(fin.hx - 20, top - 100, s); ctx.fillStyle = '#ff4f8b'; ctx.fill();
    }
    if (fT > 2) {
      ctx.globalAlpha = ease((fT - 2) / 0.8);
      const close = fin.hx - P.x < 120;
      nameTag(fin.hx + (close ? 32 : 0), top - 78, CONFIG.myName, '#3f6fd8');
      nameTag(P.x - (close ? 32 : 0), P.y - 78, CONFIG.herName, '#d63d7a');
      ctx.globalAlpha = 1;
    }
  }
  pickups.forEach(drawPickup);
  viruses.forEach(drawVirus);

  const flying = state === 'finale' && !fin.met;
  ctx.globalAlpha = P.inv > 0 && ((t * 10) | 0) % 2 ? 0.45 : 1;
  drawPerson(P.x, P.y, {
    girl: true, sq: P.sq,
    run: state === 'finale' ? null : t * (state === 'play' ? 16 : 10),
    air: flying || (state === 'play' && !P.onGround),
    wings: state === 'finale',
    arms: state === 'finale' ? (fin.met ? 'hug' : 'up') : (state === 'play' && !P.onGround ? 'up' : null),
  });
  ctx.globalAlpha = 1;

  for (const p of parts) {
    ctx.globalAlpha = clamp01(p.life / p.max);
    if (p.kind === 'heart') { heartPath(p.x, p.y, p.s); ctx.fillStyle = p.c; ctx.fill(); }
    else disc(p.x, p.y, p.s, p.c);
  }
  ctx.globalAlpha = 1;
  for (const s of texts) {
    ctx.globalAlpha = clamp01(s.life / s.max * 2);
    ctx.font = `700 ${s.big ? 24 : 16}px ${FONT}`; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(s.s, s.x, s.y);
    ctx.fillStyle = s.c; ctx.fillText(s.s, s.x, s.y);

}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}

else if (pv === '2' || pv === '3') { health = 50; startLevel(+pv - 1); }
else showTitle();
const ff = Math.min(60, +qs.get('ff') || 0); // fast-forward seconds (testing)
for (let i = 0; i < ff * 60; i++) update(1 / 60);

window.__game = { update, render, tryJump, get state() { return state; }, get level() { return level; },
  get health() { return health; }, get P() { return P; }, get viruses() { return viruses; }, pressBtn };
requestAnimationFrame(frame);
})();
